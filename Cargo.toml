[package]
name = "slush"
version = "0.1.0"
edition = "2024"
default-run = "slush"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
c-test-api = []

[dependencies]
libc = "=0.2.189"
png = "=0.18.1"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[build-dependencies]
bindgen = "=0.72.1"
